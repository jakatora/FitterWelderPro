name: cut_list_app
description: "Fitter Welder Pro — cut list builder, ISO parser, pipe-fitting and welding calculators for industrial pipe construction."
publish_to: "none"
# Nazwa wersji (0.2.0) → Android versionName, iOS CFBundleShortVersionString.
# Numer po "+" (15) → Android versionCode. Oba sklepy odrzucają upload z numerem
# nie wyższym niż ostatnio przyjęty; na Play jest już 14 (targetSdk 36).
# 15 = optymalizacja R8 (minify + shrinkResources) + próbkowanie bitmap
# (zalecenia Play Console). R8 przetestować na ścieżce testowej przed produkcją.
# iOS CFBundleVersion NIE bierze się stąd — codemagic.yaml wylicza go z licznika
# builda Codemagic (+1000), więc nie trzeba go tu podbijać.
version: 0.5.11+30

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.3
  # BEZ TEGO APLIKACJA NA WINDOWSIE NIE WSTAJE. `sqflite_common_ffi` sam nie dostarcza
  # silnika — szuka `sqlite3.dll` obok pliku wykonywalnego i przy starcie wywala
  # „Failed to load dynamic library 'sqlite3.dll'" (zmierzone 2026-08-31). Build przechodzi,
  # więc usterki nie widać aż do pierwszego uruchomienia.
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  intl: ^0.20.2
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  http: ^1.2.2
  # Zmniejszanie zdjęć przed wysłaniem do skanera (iso_scanner_ai.dart). Czysty
  # Dart; był już w projekcie jako zależność `pdf` (ta sama wersja w lock) —
  # tu tylko jawnie, żeby wolno go było importować.
  image: ^4.10.1
  crypto: ^3.0.6
  pdf: ^3.10.7
  # 10.x (nie 9.x): speech_to_text 7 wymaga `web` ^1.0, a share_plus 9 trzymał
  # `web` 0.5. API Share.share / Share.shareXFiles bez zmian (zmienia je 11.x).
  share_plus: ^10.1.4
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  # 0.4.3+1 passes String to JS interop Worker APIs and fails on Dart 3.13.
  sqflite_common_ffi_web: ^0.4.5+4
  sqflite_common: ^2.5.8
  # Lokalne przypomnienia o uprawnieniach spawacza (30 i 7 dni przed terminem).
  # 21.x, nie 22.x: 22 ciągnie flutter_local_notifications_web → web ^1.1.1,
  # co gryzie się z share_plus 9 (web ^0.5); podbicie share_plus pociąga
  # sqlite3 3.x z natywnymi build hookami — osobna decyzja, nie przy okazji.
  # Uwaga: 21.0.0 (przez flutter_local_notifications_windows 3.0.0 → xml ^6)
  # cofa przechodnio pdf 3.13.1 → 3.12.0, xml 7 → 6.6.1, archive 4.3 → 4.0.9.
  flutter_local_notifications: ^21.0.0
  # TZDateTime dla zonedSchedule (planujemy w UTC — patrz qualification_reminders.dart).
  timezone: ^0.11.0
  # Asystent głosowy (lib/assistant/speech_io.dart). 6.x NIE kompiluje się na
  # Androidzie z Flutter 3.47 (usunięty v1 `Registrar`, sprawdzone buildem).
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  # Tylko po to, żeby podniesienie `web` do 1.x nie wciągnęło sqlite3 3.x
  # (natywne build hooks zamiast sqlite3_flutter_libs) — to osobna migracja.
  sqlite3: ">=2.7.0 <3.0.0"
  # Timer spawalniczy (lib/services/weld_timer_service.dart):
  # ekran nie gaśnie, TYLKO gdy timer biegnie. Bez uprawnień.
  wakelock_plus: ^1.5.2
  # Długa wibracja na koniec chłodzenia/formowania. HapticFeedback to krótkie
  # „tyknięcia”, niewyczuwalne w rękawicach i pod kurtką, a na Androidzie
  # znikają przy wyłączonych wibracjach dotyku. Dokłada VIBRATE (uprawnienie
  # „normal”: bez pytania użytkownika, nic nie wysyła) i device_info_plus
  # (przechodnio, bez uprawnień).
  vibration: ^3.2.1
  # Czas timera z `clock.now()` — w testach widgetów podąża za czasem testu.
  # Czysty Dart, już był w lock (przechodnio).
  clock: ^1.1.1
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter
  # QA only: drives the running app (tap/type/read) from test_driver/app.dart.
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
