# Analyzer + testy jednostkowe na każdym pushu.
#
# Do 2026-08-29 repozytorium miało wyłącznie `ios-app-store.yml`, który buduje IPA
# i tylko z gałęzi `main` — a praca toczy się na `release/0.2.0`. Efekt: 22 pliki
# testów w `test/` nie uruchamiały się automatycznie ani razu, więc regresja w
# obliczeniach cut listy mogła dojechać do sklepu niezauważona.
#
# Ten pipeline jest celowo tani (ubuntu, bez podpisów, bez buildu) i ma jedno
# zadanie: nie wpuścić czerwonego testu do gałęzi.
name: Analyzer i testy

on:
  push:
    branches:
      - "**"
    paths:
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/**
      - .github/workflows/checks.yml
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Ta sama wersja co Codemagic i lokalny SDK (pubspec.lock wymaga >= 3.44).
          flutter-version: 3.47.5
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Analyzer nie jest jeszcze ustawiony na --fatal-infos: repozytorium ma
      # zaległe podpowiedzi stylu, a zablokowanie na nich każdego pusha
      # zatrzymałoby pracę zamiast ją chronić. Twardo pilnujemy ostrzeżeń i błędów.
      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Flutter test
        run: flutter test --no-pub --reporter expanded
