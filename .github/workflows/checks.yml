# Analyzer + testy jednostkowe na każdym pushu.
#
# Do 2026-08-29 repozytorium miało wyłącznie `ios-app-store.yml`, który buduje IPA
# i tylko z gałęzi `main` — a praca toczy się na `release/0.2.0`. Efekt: 22 pliki
# testów w `test/` nie uruchamiały się automatycznie ani razu, więc regresja w
# obliczeniach cut listy mogła dojechać do sklepu niezauważona.
#
# Ten pipeline jest celowo tani (ubuntu, bez podpisów) i ma dwa zadania: nie
# wpuścić czerwonego testu do gałęzi i złapać zepsuty build Androida (job
# android-debug-apk) zanim wyjdzie przy wydaniu.
name: Analyzer i testy

on:
  push:
    branches:
      - "**"
    paths:
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/**
      - android/**
      - assets/**
      - .github/workflows/checks.yml
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Ta sama wersja co Codemagic i lokalny SDK (pubspec.lock wymaga >= 3.44).
          flutter-version: 3.47.5
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Analyzer nie jest jeszcze ustawiony na --fatal-infos: repozytorium ma
      # zaległe podpowiedzi stylu, a zablokowanie na nich każdego pusha
      # zatrzymałoby pracę zamiast ją chronić. Twardo pilnujemy ostrzeżeń i błędów.
      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Flutter test
        run: flutter test --no-pub --reporter expanded

  # Build Androida (Gradle / AGP / Kotlin / R8 zasobów) — bez tego błąd
  # toolchainu wychodził dopiero przy wydaniu. APK debug: podpisany kluczem
  # debug, bez key.properties i bez sekretów. Release bez key.properties
  # celowo kończy się błędem (android/app/build.gradle.kts), więc go tu nie
  # budujemy.
  android-debug-apk:
    name: flutter build apk --debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9 / Gradle 9 wymagają JDK 17+; lokalnie budujemy na JDK 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
